# PPO + stochastic disturbance configuration (RQ2)
# Run: uv run python experiments/train_ppo_stochastic.py \
#          --config experiments/configs/ppo_stochastic.yaml \
#          --data-dir /path/to/data --run-name ppo_stochastic_v1 --wandb

# Data
subset: false
n_time_steps: 200

# Policy architecture
hidden_dim: [64, 64]
activation: relu

# Action space
k: 50

# Budget
target_protected_cells: 17000
cells_per_step: 50

# PPO hyperparameters
n_updates: 300
rollout_steps: 680
n_epochs_per_update: 4
minibatch_size: 32
clip_coef: 0.2
gamma: 0.99
gae_lambda: 0.95
vf_coef: 0.25
ent_coef: 0.02
max_grad_norm: 0.5

# Optimiser
lr: 3.0e-4
lr_anneal: true

# Species simulation
avg_carrying_capacity: 100
dispersal_rate: 0.5
dispersal_window: 3
min_habitat_suitability: 0.05

# Reward
reward_weight_cell_value: 1.0
reward_weight_cost: -0.5

# Stochastic disturbance (RQ2) — matches es_stochastic.yaml for comparability
disturbance_intensity_min: 0.05
disturbance_intensity_max: 0.5
disturbance_coherence: 8
disturbance_factors: [0.5, 0.5]
disturbance_impact_factor: 0.5

# Logging
seed: 42
plot_train_freq: 50
