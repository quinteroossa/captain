# CVaR-PPO v3 configuration (RQ3)
# Fixes v2: EN+CR-only filter, 17k budget, 4x more episodes per update.
# Run: uv run python experiments/train_ppo_cvar_v3.py \
#          --config experiments/configs/ppo_cvar_v3.yaml \
#          --data-dir ~/captain_data/captain3data --run-name ppo_cvar_v3 --wandb

# Data
subset: false
n_time_steps: 340      # 17000 budget / 50 k = 340 steps (matches ES budget)

# Policy architecture
hidden_dim: [64, 64]
activation: relu

# Action space
k: 50

# Budget
target_protected_cells: 17000
cells_per_step: 50

# CVaR episode filtering
cvar_filter: encr           # EN+CR-only score: -(EN×16 + CR×32)
n_episodes_per_update: 10   # collect 10 episodes per update
cvar_alpha: 0.2             # keep worst 20% = 2 episodes

# PPO hyperparameters
n_updates: 300
n_epochs_per_update: 4
minibatch_size: 32
clip_coef: 0.2
gamma: 0.99
gae_lambda: 0.95
vf_coef: 0.25
ent_coef: 0.02
max_grad_norm: 0.5

# Optimiser
lr: 3.0e-4
lr_anneal: true

# Species simulation
avg_carrying_capacity: 100
dispersal_rate: 0.5
dispersal_window: 3
min_habitat_suitability: 0.05

# Reward (identical to ppo_stochastic for fair comparison)
reward_weight_cell_value: 1.0
reward_weight_cost: -0.5

# Stochastic disturbance (identical to ppo_stochastic for fair comparison)
disturbance_intensity_min: 0.05
disturbance_intensity_max: 0.5
disturbance_coherence: 8
disturbance_factors: [0.5, 0.5]
disturbance_impact_factor: 0.5

# Logging
seed: 42
plot_train_freq: 50
