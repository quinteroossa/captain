# ES + stochastic disturbance configuration (RQ2)
# Run: uv run python experiments/train_es_stochastic.py --data-dir /path/to/data --run-name es_stochastic

# Data
subset: false
n_time_steps: 50

# Training
n_epochs: 500
n_perturbations: 32
n_parallel_workers: 4
n_probes: 20
calibrate_rewards: true
seed: 42

# ES hyperparameters
initial_alpha: 0.2
initial_sigma: 0.3

# Policy
hidden_dim: 16

# Budget
target_protected_cells: 17000
cells_per_step: 1000

# Species simulation
avg_carrying_capacity: 100
dispersal_rate: 0.5
dispersal_window: 3
min_habitat_suitability: 0.05

# Stochastic disturbance parameters
disturbance_mode: distribution       # "fixed" or "distribution"
disturbance_intensity: 0.3           # used when mode=fixed
disturbance_intensity_min: 0.05      # used when mode=distribution (mild season)
disturbance_intensity_max: 0.5       # used when mode=distribution (severe season)
disturbance_coherence: 8             # spatial coherence scale (higher = larger patches)
disturbance_factors: [0.5, 0.5]      # fractal persistence per octave
disturbance_impact_factor: 0.5       # how much affected cells are reduced

# Logging
plot_train_freq: 10
